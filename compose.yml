services:
  app:
    build: .
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        mvn -pl sky-server -am install -DskipTests &&
        exec java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005
        -jar sky-server/target/sky-server-1.0-SNAPSHOT.jar
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      - mysql

  nginx:
    image: nginx:1.20.2
    ports:
      - "80:80"
    volumes:
      - ../nginx-1.20.2/html:/usr/share/nginx/html:ro
      - ../nginx-1.20.2/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sky_take_out
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  maven-cache:
  mysql-data:
